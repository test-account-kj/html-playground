<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple HTML Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4ff, #d9e7ff);
      color: #1f2a44;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 420px;
    }

    h1 {
      margin-top: 0;
      color: #204080;
    }

    p {
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      background: #204080;
      color: white;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, HTML Playground!</h1>
    <p>This is a simple HTML file with embedded CSS added on a new branch.</p>
    <span class="badge">Embedded Styles</span>
  </div>
</body>
</html>
